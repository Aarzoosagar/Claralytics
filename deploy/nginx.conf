# Optional but recommended: put nginx in front of uvicorn so the API is reachable
# on port 80/443 instead of exposing 8000 directly, and so you have a place to
# terminate TLS later (e.g. via certbot) without touching the app.
#
# Install: sudo cp nginx.conf /etc/nginx/sites-available/claralytics
#          sudo ln -s /etc/nginx/sites-available/claralytics /etc/nginx/sites-enabled/
#          sudo rm -f /etc/nginx/sites-enabled/default
#          sudo nginx -t && sudo systemctl restart nginx

server {
    listen 80;
    server_name _;   # replace with your domain or EC2 public DNS

    client_max_body_size 60M;  # a little above MAX_UPLOAD_SIZE_MB

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
